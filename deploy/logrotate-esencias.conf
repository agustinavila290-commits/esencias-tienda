# ==============================================================
# logrotate — logs de Gunicorn de Esencias de la naturaleza
# Copiar a: /etc/logrotate.d/esencias
# (los logs de Nginx ya rotan solos vía /etc/logrotate.d/nginx, que cubre
# /var/log/nginx/*.log — esto es solo para los logs propios de Gunicorn.)
# ==============================================================

/srv/esencias/backend/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 esencias www-data
    sharedscripts
    postrotate
        systemctl kill -s USR1 esencias.service 2>/dev/null || true
    endscript
}
