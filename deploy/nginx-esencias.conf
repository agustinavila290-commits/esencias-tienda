# ==============================================================
# Nginx — Esencias de la naturaleza
# Reemplazar "esencias.tudominio.com.ar" con el dominio real.
#
# Copiar a: /etc/nginx/sites-available/esencias
# Activar:  ln -s /etc/nginx/sites-available/esencias /etc/nginx/sites-enabled/
# SSL:      certbot --nginx -d esencias.tudominio.com.ar
# ==============================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name esencias.tudominio.com.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name esencias.tudominio.com.ar;

    # SSL — Let's Encrypt (Certbot los agrega automáticamente)
    ssl_certificate     /etc/letsencrypt/live/esencias.tudominio.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esencias.tudominio.com.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/esencias-access.log;
    error_log  /var/log/nginx/esencias-error.log;

    client_max_body_size 20M;

    # Cabeceras de seguridad comunes a toda la respuesta del sitio. Nginx NO
    # hereda add_header de "server" en un location que ya tiene los suyos
    # propios (ej. los de Cache-Control más abajo), así que se repiten en
    # cada location en vez de confiar en la herencia.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;

    # API Django (Gunicorn en puerto 8001)
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Django Admin técnico (Jazzmin). Django lo expone en /django-admin/,
    # NO en /admin/ — esa ruta es del panel React (ver "location /" más abajo).
    location /django-admin/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP más permisivo que el de la SPA porque Jazzmin usa estilos/scripts
        # inline propios; igual bloquea framing y fuentes de scripts externas.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; frame-ancestors 'none'" always;

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # NOTA: no debe existir ningún location /admin/ que proxee a Django.
    # /admin y /admin/* son rutas de la SPA de React (panel interno) y deben
    # caer en el location "/" de más abajo, que sirve index.html con fallback
    # de React Router (soporta F5 / acceso directo a subrutas).

    # SEO: robots.txt y sitemap.xml se generan dinámicamente en Django
    # (con productos/categorías activos reales), no son archivos estáticos.
    location = /robots.txt {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
    }
    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
    }

    # Archivos media (imágenes de productos)
    location /media/ {
        add_header X-Content-Type-Options "nosniff" always;
        alias /srv/esencias/backend/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        location ~* \.(py|sh|env|key|pem|crt|sql|sqlite3)$ {
            deny all;
        }
    }

    # Archivos estáticos Django
    location /static/ {
        add_header X-Content-Type-Options "nosniff" always;
        alias /srv/esencias/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend React — SPA (incluye /admin, que es una ruta de React, no de Django)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Google Identity Services (login admin) necesita accounts.google.com
        # en script-src/frame-src/connect-src. Mercado Pago no necesita nada
        # acá porque el checkout es una redirección de página completa, no un
        # iframe embebido. 'unsafe-inline' en style-src es por los estilos
        # inline puntuales de React (ej. animationDelay); script-src NO lo tiene.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        root  /srv/esencias/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache agresivo para assets compilados (tienen hash en nombre)
    location ~* ^/assets/.+\.(js|css|png|jpg|svg|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        root    /srv/esencias/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
